<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Draftosaurus — Herramienta de Apoyo</title>
  <link rel="stylesheet" href="game.css">
  <style>
    /* Ocultar elementos relacionados con el dado */
    #tirar-dado,
    .dado-wrapper,
    #reglas_del_dado {
      display: none;
    }
  </style>
</head>

<body>
  <h1>DRAFTOSAURUS - HERRAMIENTA DE APOYO</h1>

  <audio id="musica" src="../../assets/Rugidos del Pasado.mp3" loop autoplay></audio>

  <div id="juego">
    <div class="layout-juego">
      <div class="panel-controles">
        <div id="mano">
          <h2>Tu Mano</h2>
          <div id="contenedor-mano" class="contenedor-dinos"></div>
        </div>

        <div class="controles">
          <button id="guardar-partida">Calcular Puntos</button>
        </div>
        <div class="seccion-info">
          <p id="puntuacion">Puntuación: 0</p>
        </div>
        <button id="silenciar-musica">🔈</button>
      </div>

      <div class="main-container-grid">
        <video autoplay muted loop>
          <source src="../../assets/mapa.mp4" type="video/mp4">
          <img src="../../assets/mapa.png" alt="Mapa de fondo" style="width: 100%; height: 100%; object-fit: cover;">
        </video>
        <div class="grid-container">
          <div class="grid-item zona" id="rivera" data-zona="rivera">
            <img src="../../assets/RIVERA.png" alt="rivera">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="campo" data-zona="campo">
            <img src="../../assets/CAMPO.png" alt="campo">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="montevideo" data-zona="montevideo">
            <img src="../../assets/MONTEVIDEO.png" alt="montevideo">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item grid-item-central zona" id="rio" data-zona="rio">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="transiberiano" data-zona="transiberiano">
            <img src="../../assets/TRANSIBERIANO.png" alt="transiberiano">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="moscu" data-zona="moscu">
            <img src="../../assets/MOSKVA.png" alt="moscu">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="cheliabinsk" data-zona="cheliabinsk">
            <img src="../../assets/CHELYABINSK.png" alt="cheliabinsk">
            <div class="dinos-en-zona"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="herramienta_game2.js"></script>
  <script>
    // ----- MODIFICACIÓN PARA HERRAMIENTA DE APOYO -----
    // Eliminamos cualquier referencia al dado
    const botonDado = document.getElementById("tirar-dado");
    if (botonDado) botonDado.remove();

    const valorDado = document.getElementById("valor-dado");
    if (valorDado) valorDado.remove();

    // Ahora la función de colocar dinosaurios se maneja solo con la selección manual de la mano y zona
    // Suponiendo que tu script.js ya permite drag & drop para colocar dinosaurios
  </script>
</body>

</html>
