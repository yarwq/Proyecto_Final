<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Draftosaurus — World Tour</title>
  <link rel="stylesheet" href="../esp/game.css">
</head>

<body>
  <h1>DRAFTOSAURUS - VIRTUAL GAME</h1>

  <div id="seleccion-jugadores">
    <h2>Select number of players</h2>
    <ul class="jugadores-opciones">
      <li tabindex="0" class="jugador-opcion" data-value="2"><span>2</span></li>
      <li tabindex="0" class="jugador-opcion" data-value="3"><span>3</span></li>
      <li tabindex="0" class="jugador-opcion" data-value="4"><span>4</span></li>
      <li tabindex="0" class="jugador-opcion" data-value="5"><span>5</span></li>
    </ul>
    <button id="iniciar-juego">Start Game</button>
  </div>

  <div id="registro-nombres" style="display:none;">
    <h2>Player Names</h2>
    
    <form class="nombres-form">
      <!-- Fields generated dynamically based on number of players -->
    </form>

    <div class="nombres-button-container">
      <button class="nombres-btn nombres-btn-back"><span>Back</span></button>
      <button class="nombres-btn nombres-btn-continue"><span>Continue</span></button>
    </div>
  </div>

n  <audio id="musica" src="../../assets/Rugidos del Pasado.mp3" loop autoplay></audio>

  <div id="juego" style="display:none;">
    <div class="layout-juego">
      <div class="panel-controles">
        <div id="mano">
          <h2>Your Hand</h2>
          <div id="contenedor-mano" class="contenedor-dinos"></div>
        </div>
        <div class="controles">
          <div style="position:relative;display:inline-block;">
            <button id="tirar-dado">Roll die</button>
          </div>
          <div class="dado-wrapper">
            <div id="valor-dado" class="dado-container">—</div>
          </div>
        </div>
        <div class="controles">
          <button id="guardar-partida">💾 Save Game</button>
        </div>
        <button id="cargar-partida">Load game</button>
        <select id="lista-partidas" style="display:none"></select>

        <div class="seccion-info">
          <p id="jugador">Player 1 — Turn 1</p>
          <p id="puntuacion">Score: 0</p>
        </div>
        <button id="silenciar-musica">🔈</button>
      </div>

n      <div class="main-container-grid">
        <video autoplay muted loop>
          <source src="../../assets/mapa.mp4" type="video/mp4">
          <!-- Fallback -->
          <img src="../../assets/mapa.png" alt="Map background" style="width: 100%; height: 100%; object-fit: cover;">
        </video>
        <div class="grid-container">
          <div class="grid-item zona" id="rivera" data-zona="rivera">
            <img src="../../assets/RIVERA.png" alt="rivera">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="campo" data-zona="campo">
            <img src="../../assets/CAMPO.png" alt="campo">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="montevideo" data-zona="montevideo">
            <img src="../../assets/MONTEVIDEO.png" alt="montevideo">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item grid-item-central zona" id="rio" data-zona="rio">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="transiberiano" data-zona="transiberiano">
            <img src="../../assets/TRANSIBERIANO.png" alt="transiberiano">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="moscu" data-zona="moscu">
            <img src="../../assets/MOSKVA.png" alt="moscu">
            <div class="dinos-en-zona"></div>
          </div>
          <div class="grid-item zona" id="cheliabinsk" data-zona="cheliabinsk">
            <img src="../../assets/CHELYABINSK.png" alt="cheliabinsk">
            <div class="dinos-en-zona"></div>
          </div>
        </div>
      </div>

n      <div id="reglas_del_dado" class="reglas_del_dado">
        <img src="../../assets/reglas_del_dado.png" alt="Dice rules">
        <button id="menu">Return to main menu</button>
      </div>
    </div>
  </div>

n  <script src="../esp/alerta.js"></script>
  <script src="../esp/classes.js"></script>
  <script src="../esp/script.js"></script>
  <script src="../esp/carPar.js"></script>
</body>

</html>
