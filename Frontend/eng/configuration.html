<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Configuration — Draftosaurus</title>
    <link rel="stylesheet" href="../esp/style.css">
</head>

<body>
    <div class="container">
        <div class="logo-box">
            <img src="../../assets/logo.png" alt="logo">
        </div>

        <h1 class="config-title">Configuration</h1>

        <div class="config-volumen">
            <h2 class="config-subtitle">Volume</h2>
            <audio id="musica" src="../../assets/Draftosaurus.mp3" loop autoplay></audio>
            <button id="silenciar-musica" class="btn config-vol-btn">🔈</button>
        </div>

        <div class="config-idioma">
            <h2 class="config-subtitle">Language</h2>
            <div class="idioma-btn-group">
                <button id="btn-es" class="btn idioma-btn" data-idioma="es" title="Español">
                    <img src="../../assets/spain.png" alt="Spain flag" class="idioma-flag"> Español
                </button>
                <button id="btn-en" class="btn idioma-btn selected" data-idioma="en" title="English">
                    <img src="../../assets/usa.png" alt="USA flag" class="idioma-flag"> English
                </button>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('silenciar-musica');
        const audio = document.getElementById('musica');
        btn.onclick = function () {
            audio.muted = !audio.muted;
            btn.textContent = audio.muted ? '🔇' : '🔈';
        };


        const btnEs = document.getElementById('btn-es');
        const btnEn = document.getElementById('btn-en');

        btnEs.onclick = function () {
            btnEs.classList.add('selected');
            btnEn.classList.remove('selected');

            localStorage.setItem('language', 'es');

            if (window.location.pathname.includes('/eng/')) {
                const newPath = window.location.pathname.replace('/eng/', '/');
                window.location.href = newPath;
            }
        };


        btnEn.onclick = function () {
            btnEn.classList.add('selected');
            btnEs.classList.remove('selected');

            localStorage.setItem('language', 'en');


            if (!window.location.pathname.includes('/eng/')) {
                const newPath = window.location.pathname.replace(/\/([^\/]+)$/, '/eng/$1');
                window.location.href = newPath;
            }
        };


        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('language');
            if (savedLang === 'en' && !window.location.pathname.includes('/eng/')) {
                const newPath = window.location.pathname.replace(/\/([^\/]+)$/, '/eng/$1');
                window.location.href = newPath;
            }
        });
    </script>
</body>

</html>
